[pytest]
testpaths = tests
markers =
    unit: pure unit tests (no model, fakes where needed)
    integration: multi-component tests with a FAKE model or the MOCK backend (no real inference)
    real_model: uses the actual XTTS-v2 checkpoint; select explicitly with -m real_model
# Real-model tests never run by default. They also never download: they skip if the
# checkpoint is not already cached, and the adapter forces Hugging Face offline mode.
addopts = -m "not real_model"
